project:
  name: employee-attrition-pipeline
  version: "1.0.0"
  random_state: 42

paths:
  raw_data: data/raw/WA_Fn-UseC_-HR-Employee-Attrition.csv
  interim_data: data/interim/cleaned_employee_attrition.csv
  processed_data: data/processed/processed_employee_attrition.csv
  model_output: models/best_model.joblib
  metrics_output: reports/metrics/model_comparison.csv
  figures_directory: reports/figures
  logs_directory: logs
  metrics_directory: reports/metrics
  feature_importance_output: reports/metrics/feature_importance.csv
  feature_importance_figure: reports/figures/feature_importance.png
data:
  target_column: Attrition
  test_size: 0.20
  validation_size: 0.20

  required_columns:
    - Age
    - Attrition
    - BusinessTravel
    - DailyRate
    - Department
    - DistanceFromHome
    - Education
    - EnvironmentSatisfaction
    - Gender
    - HourlyRate
    - JobInvolvement
    - JobLevel
    - JobRole
    - JobSatisfaction
    - MaritalStatus
    - MonthlyIncome
    - MonthlyRate
    - NumCompaniesWorked
    - OverTime
    - PercentSalaryHike
    - PerformanceRating
    - RelationshipSatisfaction
    - StockOptionLevel
    - TotalWorkingYears
    - TrainingTimesLastYear
    - WorkLifeBalance
    - YearsAtCompany
    - YearsInCurrentRole
    - YearsSinceLastPromotion
    - YearsWithCurrManager

  expected_target_values:
    - "Yes"
    - "No"

  constant_columns:
    - EmployeeCount
    - Over18
    - StandardHours

  identifier_columns:
    - EmployeeNumber

training:
  cross_validation_folds: 5
  scoring_metric: roc_auc
  n_jobs: -1